<h2>Your Prediction History</h2>

<table>
<tr>
  <th>AGE</th><th>TENURE</th><th>MONTHLY CHARGE</th><th>COMPLAINTS</th><th>RESULT</th>

  <td>{{ row[4] }}</td>
  <td>{{ row[5] }}</td>
  <td>{{ row[6] }}</td>
</tr>
{% endfor %}
</table>
